<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: luna-asset:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>luna 网页工具</title><link rel="stylesheet" href="page-tool.css"></head>
<body><header><span id="tool-title"></span><div class="actions"><button id="copy-link" title="复制网页地址">复制链接</button><button id="open-original">打开原网页</button><button id="close" aria-label="关闭">×</button></div></header>
<main><section id="image-view" hidden><h1 id="page-title"></h1><img id="preview" alt=""><p id="url"></p><div class="image-actions"><button id="copy-image">复制图片</button><button id="save-image" class="primary">保存图片…</button></div><p id="image-help"></p></section>
<section id="reader" hidden><div class="reader-actions"><span>字号</span><button id="smaller" aria-label="减小字号">A−</button><button id="larger" aria-label="增大字号">A+</button><button id="print">打印…</button></div><article><h1 id="heading"></h1><p id="byline"></p><div id="article-body"></div></article></section></main>
<div id="status" role="status" aria-live="polite"></div><script src="appearance-model.js"></script><script src="appearance-theme.js"></script><script src="page-tool-ui.js"></script></body></html>
